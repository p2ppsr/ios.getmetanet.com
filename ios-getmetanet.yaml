apiVersion: apps/v1
kind: Deployment
metadata:
  name: ios-getmetanet-web
  namespace: ios-getmetanet
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ios-getmetanet-web
  template:
    metadata:
      labels:
        app: ios-getmetanet-web
    spec:
      nodeSelector:
        kubernetes.io/hostname: server2
      containers:
        - name: web
          image: registry.cars-operator-system.svc.cluster.local:5000/local/ios-getmetanet-web:20260626-welcome-router-7240ebf
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /apple-app-site-association
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /apple-app-site-association
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: ios-getmetanet-web
  namespace: ios-getmetanet
spec:
  selector:
    app: ios-getmetanet-web
  ports:
    - name: http
      port: 80
      targetPort: 8080
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ios-getmetanet-ing
  namespace: ios-getmetanet
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: nginx
  rules:
    - host: ios.getmetanet.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ios-getmetanet-web
                port:
                  number: 80
  tls:
    - hosts:
        - ios.getmetanet.com
      secretName: ios-getmetanet-tls
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: ios-getmetanet-tls
  namespace: ios-getmetanet
spec:
  secretName: ios-getmetanet-tls
  issuerRef:
    name: letsencrypt-nginx
    kind: ClusterIssuer
  dnsNames:
    - ios.getmetanet.com
